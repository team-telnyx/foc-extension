<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOC Calendar Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      width: 360px;
      min-height: 200px;
    }

    .header {
      background: linear-gradient(135deg, #1a1f2e, #252d40);
      padding: 14px 16px;
      border-bottom: 1px solid #2d3748;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon { font-size: 20px; }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .header-sub {
      font-size: 11px;
      color: #718096;
      margin-top: 1px;
    }

    .body { padding: 16px; }

    .field { margin-bottom: 12px; }

    label {
      display: block;
      font-size: 11px;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #4a90d9; }
    input::placeholder { color: #4a5568; }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled {
      background: #2d3748;
      color: #4a5568;
      cursor: not-allowed;
    }

    .btn-success {
      background: #10b981;
      color: #fff;
    }

    .btn-success:hover { background: #059669; }

    .preview {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      display: none;
    }

    .preview.visible { display: block; }

    .preview-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .preview-row:last-child { margin-bottom: 0; }

    .preview-key {
      color: #718096;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .preview-val {
      color: #e2e8f0;
      text-align: right;
      word-break: break-word;
    }

    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: capitalize;
    }
    .status-badge.submitted { background: #1e3a5f; color: #63b3ed; }
    .status-badge.in-process { background: #1e3a5f; color: #63b3ed; }
    .status-badge.exception { background: #3b2f1a; color: #ed8936; }
    .status-badge.foc-date-confirmed { background: #1a3a2f; color: #68d391; }
    .status-badge.ported { background: #1a3a2f; color: #68d391; }
    .status-badge.cancelled { background: #3b1f1f; color: #fc8181; }
    .status-badge.cancel-pending { background: #3b1f1f; color: #fc8181; }
    .status-badge.new { background: #2d3748; color: #a0aec0; }
    .status-badge.unknown { background: #2d3748; color: #a0aec0; }

    .preview-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2d3748;
    }

    .status {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: none;
    }

    .status.visible { display: block; }
    .status.loading { background: #1e3a5f; color: #63b3ed; }
    .status.error { background: #3b1f1f; color: #fc8181; }
    .status.success { background: #1a3a2f; color: #68d391; }

    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid #63b3ed;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .detected-badge {
      font-size: 10px;
      background: #1a3a2f;
      color: #68d391;
      padding: 2px 7px;
      border-radius: 10px;
      margin-left: 6px;
    }

    .settings-link {
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
      color: #4a5568;
    }

    .settings-link a {
      color: #4a90d9;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">📅</div>
    <div>
      <div class="header-title">FOC Calendar Sync</div>
      <div class="header-sub">APAC Porting Orders</div>
    </div>
  </div>

  <div class="body">
    <div class="field">
      <label>SR Order ID <span id="detectedBadge" class="detected-badge" style="display:none">Auto-detected</span></label>
      <input type="text" id="srInput" placeholder="e.g. sr_abc123xyz" autocomplete="off" />
    </div>

    <div id="status" class="status"></div>

    <div id="preview" class="preview">
      <div class="preview-title" id="previewTitle"></div>
      <div class="preview-row">
        <span class="preview-key">Status</span>
        <span class="preview-val" id="previewStatus"></span>
      </div>
      <div class="preview-row">
        <span class="preview-key">Date</span>
        <span class="preview-val" id="previewDate"></span>
      </div>
      <div class="preview-row">
        <span class="preview-key">Duration</span>
        <span class="preview-val" id="previewDuration"></span>
      </div>
    </div>

    <button class="btn btn-primary" id="fetchBtn">🔍 Fetch Order Details</button>
    <div style="height:8px"></div>
    <button class="btn btn-success" id="createBtn" style="display:none">📅 Create Calendar Event</button>

    <div class="settings-link">
      <a href="#" id="logsLink">📋 Logs</a>
    </div>

    <div id="debugInfo" style="font-size:10px; color:#999; padding:4px 0; word-break:break-all; display:none;"></div>
  </div>

  <script src="src/popup.js"></script>
</body>
</html>
